<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="./favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Magdalena | Historias con impacto</title>
  <meta name="description"
    content="Narrativas creíbles, visibles y relevantes. Storytelling, audiovisual y consultoría para organizaciones con propósito.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.lamagdalena.com/">
  <meta property="og:title" content="La Magdalena | Historias con impacto">
  <meta property="og:description"
    content="Narrativas creíbles, visibles y relevantes. Storytelling, audiovisual y consultoría para organizaciones con propósito.">
  <meta property="og:image" content="/og-image.jpg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://www.lamagdalena.com/">
  <meta property="twitter:title" content="La Magdalena | Historias con impacto">
  <meta property="twitter:description"
    content="Narrativas creíbles, visibles y relevantes. Storytelling, audiovisual y consultoría para organizaciones con propósito.">
  <meta property="twitter:image" content="/og-image.jpg">

  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This script checks to see if a redirect is present in the query string,
    // converts it back into a correct url and adds it to the
    // browser's history using window.history.replaceState(...),
    // which causes the window to load the correct path for the SPA.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>

</html>
